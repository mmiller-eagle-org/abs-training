# Builds the site with the same Jekyll action GitHub Pages uses, so a broken build
# shows up on the pull request instead of on abs-training.com. Does not deploy.
name: Pages build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll (GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check expected pages exist
        run: |
          set -e
          for f in index.html cookie-policy/index.html contact/index.html contact/thank-you/index.html courses/index.html courses/view/index.html sitemap.xml robots.txt CNAME \
                   assets/js/course-offerings.js assets/js/upcoming-classes.js assets/js/course-catalog.js \
                   assets/js/catalog-page.js assets/js/course-view.js assets/js/contact-form.js assets/js/thank-you.js assets/js/analytics.js assets/js/consent.js; do
            test -f "_site/$f" || { echo "Missing _site/$f"; exit 1; }
          done
          count=$(find _site/courses -mindepth 2 -name index.html -not -path '_site/courses/view/*' | wc -l)
          echo "Course pages built: $count"
          test "$count" -ge 1
          # The catalog lists the course pages as JSON; a bad value would break search
          python3 -c "import json,re,sys; h=open('_site/courses/index.html',encoding='utf-8').read(); m=re.search(r'<script type=\"application/json\" id=\"site-courses\">(.*?)</script>',h,re.S); d=json.loads(m.group(1)); print('Catalog course pages:',len(d)); sys.exit(0 if len(d)==$count else 1)"
          # Every industry in _data/industries.yml has a home page tile, a catalog filter option and at least one course
          python3 -c "import json,re,sys; h=open('_site/courses/index.html',encoding='utf-8').read(); d=json.loads(re.search(r'id=\"site-courses\">(.*?)</script>',h,re.S).group(1)); home=open('_site/index.html',encoding='utf-8').read(); ids=re.findall(r'data-industry-option=\"([a-z0-9-]+)\"',h); counts={i:sum(i in c['industries'] for c in d) for i in ids}; print('Industry courses:',counts); tiles=re.findall(r'data-industry=\"([a-z0-9-]+)\"',home); sys.exit(0 if ids and tiles==ids and all(counts.values()) else 1)"
          # Every course photo the pages use exists (copied from the portal by the sync, or the default photo)
          python3 -c "import glob,os,re,sys; refs={u for f in glob.glob('_site/**/*.html',recursive=True) for u in re.findall(r'(/assets/images/course[^\"\s,]+\.jpg)',open(f,encoding='utf-8').read())}; missing=[u for u in refs if not os.path.isfile('_site'+u)]; print('Course photos referenced:',len(refs),'missing:',missing); sys.exit(1 if missing or len(refs)<3 else 0)"
          # The course view page must stay out of search results and the sitemap
          grep -q 'name="robots" content="noindex' _site/courses/view/index.html
          ! grep -q '/courses/view/' _site/sitemap.xml
          # The Thank You page is only reached after sending the contact form
          grep -q 'name="robots" content="noindex' _site/contact/thank-you/index.html
          ! grep -q '/contact/thank-you/' _site/sitemap.xml
          # Every course page, including the ones generated from the portal snapshot, is in the sitemap
          inmap=$(grep -c '/courses/[a-z0-9-]*/</loc>' _site/sitemap.xml)
          echo "Course pages in sitemap: $inmap"
          test "$inmap" -eq "$count"

      - name: Upload built site for preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 7
