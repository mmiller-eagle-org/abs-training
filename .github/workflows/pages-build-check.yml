# Builds the site with the same Jekyll action GitHub Pages uses, so a broken build
# shows up on the pull request instead of on abs-training.com. Does not deploy.
name: Pages build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll (GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check expected pages exist
        run: |
          set -e
          for f in index.html cookie-policy/index.html courses/index.html courses/view/index.html sitemap.xml robots.txt CNAME \
                   assets/js/course-offerings.js assets/js/upcoming-classes.js assets/js/course-catalog.js \
                   assets/js/catalog-page.js assets/js/course-view.js assets/js/analytics.js assets/js/consent.js; do
            test -f "_site/$f" || { echo "Missing _site/$f"; exit 1; }
          done
          count=$(find _site/courses -mindepth 2 -name index.html -not -path '_site/courses/view/*' | wc -l)
          echo "Course pages built: $count"
          test "$count" -ge 1
          # The catalog lists the course pages as JSON; a bad value would break search
          python3 -c "import json,re,sys; h=open('_site/courses/index.html',encoding='utf-8').read(); m=re.search(r'<script type=\"application/json\" id=\"site-courses\">(.*?)</script>',h,re.S); d=json.loads(m.group(1)); print('Catalog course pages:',len(d)); sys.exit(0 if len(d)==$count else 1)"
          # The course view page must stay out of search results and the sitemap
          grep -q 'name="robots" content="noindex' _site/courses/view/index.html
          ! grep -q '/courses/view/' _site/sitemap.xml
          # Every course page, including the ones generated from the portal snapshot, is in the sitemap
          inmap=$(grep -c '/courses/[a-z0-9-]*/</loc>' _site/sitemap.xml)
          echo "Course pages in sitemap: $inmap"
          test "$inmap" -eq "$count"

      - name: Upload built site for preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 7
