<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#001E40">
    <script src="{{ '/assets/js/analytics.js' | relative_url }}"></script>
    {% assign gtm_id = site.analytics.gtm_id | default: "" | strip %}
    {% if gtm_id != "" %}
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer',{{ gtm_id | jsonify }});</script>
    {% endif %}
    {% seo %}
{% include head.html %}
</head>
<body class="bg-gray-50 text-abs-blue-dark">
{% if gtm_id != "" %}
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ gtm_id | url_encode }}" height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
{% endif %}

<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-white focus:px-5 focus:py-3 focus:text-sm focus:font-bold focus:text-abs-blue focus:shadow-card-hover focus:outline-none focus:ring-2 focus:ring-abs-red">Skip to main content</a>

<header>
{% include nav.html %}
</header>

<main id="main" tabindex="-1" class="outline-none">
{{ content }}
</main>

{% include footer.html %}
</body>
</html>
