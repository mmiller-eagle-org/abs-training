title: ABS Training
tagline: Leading Maritime & Offshore Education
description: >-
  Equip your workforce with industry-driven regulatory, technical and operational
  training to improve the safety, reliability and efficiency of your operations.
url: "https://abs-training.com"
lang: en_US

# Seertech LMS portal (site "abs", region "gl")
portal:
  base: "https://portal.abs-training.com"
  site: abs
  region: gl
  catalog: "https://portal.abs-training.com/catalog/abs/region/gl/lang/en-us/"

social:
  name: American Bureau of Shipping
  links:
    - https://www.linkedin.com/company/american-bureau-of-shipping

# Google Tag Manager container for abs-training.com (account "ABS Training"). Empty = tracking off.
# GA4 property "ABS Training (abs-training.com)", measurement ID G-0LT6YRRFZH, is configured inside it.
# Consent Mode defaults: _layouts/default.html; cookie banner: _includes/consent-banner.html + assets/js/consent.js.
analytics:
  gtm_id: "GTM-5W4KPWDJ"
  ga4_id: "G-0LT6YRRFZH"  # used to name the _ga_ cookie on /cookie-policy/

collections:
  courses:
    output: true
    permalink: /courses/:name/

defaults:
  - scope:
      path: ""
      type: courses
    values:
      layout: course

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - "*.tmp"
  - PROJECT-NOTES.md
