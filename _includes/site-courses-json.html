<!-- On-site course pages for assets/js/course-catalog.js: they are merged into the live portal list by course_id -->
<script type="application/json" id="site-courses">
[{% for course in site.courses %}
    {"id": {{ course.course_id | jsonify }}, "title": {{ course.title | jsonify }}, "description": {{ course.description | jsonify }}, "tag": {{ course.tag | jsonify }}, "duration": {{ course.duration | jsonify }}, "format": {{ course.format | jsonify }}, "url": {{ course.url | relative_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}
]
</script>
